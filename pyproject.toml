[project]
name = "ha-device-mac-link"
version = "0.0.2" # x-release-please-version
description = "Home Assistant integration that adds a device's real network MAC (learned from a companion sensor) as a device-registry connection, so devices link to their switch port and other representations."
license = "MIT"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
  # Requires Home Assistant 2026.9+: a shared MAC connection links two device
  # entries (the 2026.8 per-config-entry device split), and the device registry
  # takes the 2026.9 shape (iterable `devices`, child-device-aware `async_get`).
  # pytest-homeassistant-custom-component pins HA exactly, so uv resolves the
  # plugin release whose pinned HA satisfies this constraint.
  "homeassistant==2026.9.*",
  "pytest-homeassistant-custom-component>=0.13.323",
  "pytest-cov>=5",
  "mypy>=2.1.0",
]

[tool.uv]
required-version = "==0.12.9"
# HA's test plugin pulls an older mypy; force a build new enough to parse the
# Python 3.14 parenthesis-optional `except A, B:` (PEP 758) syntax.
override-dependencies = ["mypy>=2.1.0"]

[tool.mypy]
# Both the component and the tests refer to it as custom_components.*, so use
# explicit package bases (not mypy_path) to avoid a dual-module-name clash.
explicit_package_bases = true
namespace_packages = true
strict = true

# The pytest-homeassistant-custom-component test plugin ships no py.typed; HA
# core itself is fully typed, so this is the only relaxation tests need.
[[tool.mypy.overrides]]
module = "pytest_homeassistant_custom_component.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

# Read by the pre-commit ruff hook (the default rule set is kept; this only sets
# the target version + line width).
[tool.ruff]
target-version = "py314"
line-length = 88

[tool.coverage.run]
source = ["custom_components/device_mac_link"]
